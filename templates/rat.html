<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preenchimento de RAT - JRV-TI</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-principal: #121212;
            --bg-painel: #1e1e1e;
            --border-painel: #2d2d2d;
            --bg-campo: #161616;
            --border-campo: #3a3a3a;
            --texto-principal: #ffffff;
            --texto-label: #a0a0a0;
            --texto-secao: #ffffff;
            --border-secao: #ffffff;
            --bg-status: #222222;
            --texto-status: #ffffff;
            --btn-secundario-bg: #161616;
            --btn-secundario-txt: #ffffff;
            --btn-secundario-border: #3a3a3a;
            --btn-secundario-hover: #ffffff;
            --btn-secundario-hover-txt: #000000;
        }

        .modo-claro {
            --bg-principal: #f0f2f5;
            --bg-painel: #ffffff;
            --border-painel: #000000;
            --bg-campo: #ffffff;
            --border-campo: #000000;
            --texto-principal: #000000;
            --texto-label: #000000;
            --texto-secao: #000000;
            --border-secao: #000000;
            --bg-status: #ffffff;
            --texto-status: #000000;
            --btn-secundario-bg: #ffffff;
            --btn-secundario-txt: #000000;
            --btn-secundario-border: #000000;
            --btn-secundario-hover: #000000;
            --btn-secundario-hover-txt: #ffffff;
        }

        #sistema-rat-isolado {
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            background-color: var(--bg-principal) !important;
            z-index: 999999 !important;
            display: flex !important; gap: 20px !important;
            padding: 20px !important; box-sizing: border-box !important;
            font-family: 'Segoe UI', Arial, sans-serif !important;
            transition: background-color 0.3s ease;
        }
        #sistema-rat-isolado *, #sistema-rat-isolado ::after, #sistema-rat-isolado ::before { box-sizing: border-box !important; }
        
        .painel-controle { width: 38% !important; min-width: 420px !important; background: var(--bg-painel) !important; padding: 25px !important; border: 2px solid var(--border-painel) !important; height: calc(100vh - 40px) !important; overflow-y: auto !important; }
        .painel-visao { width: 62% !important; background: var(--bg-principal) !important; padding: 15px !important; border: 2px solid var(--border-painel) !important; display: flex !important; flex-direction: column !important; align-items: center !important; height: calc(100vh - 40px) !important; overflow-y: auto !important; }
        .status-box { background: var(--bg-status); padding: 12px; border: 2px solid var(--border-secao); text-align: center; font-weight: bold; color: var(--texto-status); font-size: 13px; text-transform: uppercase; margin-bottom: 15px; }
        .secao-titulo { font-size: 13px; font-weight: bold; color: var(--texto-secao); text-transform: uppercase; margin: 20px 0 10px 0; border-bottom: 2px solid var(--border-secao); padding-bottom: 3px; letter-spacing: 1px; }
        .grupo-campo { background: var(--bg-campo); padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-campo); }
        .grupo-campo label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: var(--texto-label); text-transform: uppercase; }
        .grupo-campo input, .grupo-campo textarea { width: 100%; padding: 8px; background: var(--bg-campo); border: 1px solid var(--border-campo); color: var(--texto-principal); font-size: 13px; font-weight: 500; }
        textarea { height: 55px; resize: vertical; }
        .container-botoes-acoes { display: flex; gap: 10px; margin-top: 8px; }
        .linha-material { display: flex; gap: 5px; margin-bottom: 2px; }
        .btn-acao-top { background: var(--btn-secundario-bg); color: var(--btn-secundario-txt); border: 2px solid var(--btn-secundario-border); padding: 8px 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; width: 100%; text-transform: uppercase; font-size: 11px; display: block; text-align: center; text-decoration: none; }
        .btn-acao-top:hover { background: var(--btn-secundario-hover); color: var(--btn-secundario-hover-txt); }
        .btn-adicionar { background: var(--btn-secundario-bg); color: var(--btn-secundario-txt); border: 2px solid var(--btn-secundario-border); padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 11px; flex: 1; text-align: center; text-transform: uppercase; }
        .btn-remover { background: var(--btn-secundario-bg); color: #ff3333; border: 2px solid #ff3333; padding: 6px 12px; cursor: pointer; font-weight: bold; font-size: 11px; flex: 1; text-align: center; text-transform: uppercase; }
        .btn-gerar { width: 100%; padding: 15px; background: #000000; color: #ffffff; border: 2px solid #ffffff; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 20px; position: sticky; bottom: 0; text-transform: uppercase; letter-spacing: 1px; }
        .btn-gerar:hover { background: #ffffff; color: #000000; border-color: #000000; }
        .container-canvas { position: relative; width: 612px; height: 792px; background: #fff; box-shadow: 0 4px 25px rgba(0,0,0,0.7); flex-shrink: 0; }
        #pdf-frame { width: 100%; height: 100%; border: none; display: block; }
        .ponto-alvo { position: absolute; width: 8px; height: 8px; background: #ff3333; border: 1px solid #fff; border-radius: 50%; cursor: move; pointer-events: auto; transform: translate(-50%, -50%); z-index: 999; }
        .ocultar-pontos .ponto-alvo { display: none !important; }
        .info-pos { font-size: 10px; color: var(--texto-label); display: block; margin-top: 4px; font-family: monospace; opacity: 0.7; }
    </style>
</head>
<body>

<div id="sistema-rat-isolado">
    <div class="painel-controle">
        <a href="/admin" class="btn-acao-top">⬅ Cancelar e Voltar</a>
        <button type="button" class="btn-acao-top" onclick="alternarTemaCor()">🌓 Alternar Tema</button>
        <button type="button" class="btn-acao-top" id="btnMiras" onclick="alternarMiras()">Ocultar Pontos de Ajuste</button>
        <div id="statusSistema" class="status-box">Carregando formulário...</div>
        <h3 style="color: var(--texto-principal); margin-top:15px; border-bottom: 2px solid var(--border-secao); padding-bottom:5px;">RAT — {{ chamado.codigo_os }}</h3>
        
        <form id="formularioRAT" onsubmit="event.preventDefault();">
            <div class="secao-titulo">1. Dados do Cliente</div>
            <div class="grupo-campo"><label>Cliente</label><input type="text" id="val_cliente" value="{{ chamado.cliente }}" oninput="atualizarPreview()"></div>
            <div class="grupo-campo"><label>Nº Ordem</label><input type="text" id="val_n_ordem" value="{{ chamado.codigo_os }}" oninput="atualizarPreview()"></div>
            <div class="grupo-campo"><label>Telefones</label><input type="text" id="val_telefones" value="{{ chamado.whatsapp }}" oninput="atualizarPreview()"></div>
            <div class="secao-titulo">4. Materiais e Condições</div>
            <div class="grupo-campo">
                <label>Listagem de Materiais</label>
                <div id="container-linhas-materiais"></div>
                <div class="container-botoes-acoes">
                    <button type="button" class="btn-adicionar" onclick="adicionarNovaLinhaMaterial()">+ Adicionar Item</button>
                    <button type="button" class="btn-remover" onclick="removerUltimaLinhaMaterial()">✕ Remover Item</button>
                </div>
            </div>
        </form>
        <button class="btn-gerar" onclick="salvarEFinalizarNoServidor()">Finalizar e Arquivar Chamado</button>
    </div>

    <div class="painel-visao">
        <div class="container-canvas" id="canvasContainer">
            <iframe id="pdf-frame"></iframe>
            <div id="camada-arrastavel"></div>
        </div>
    </div>
</div>

<script>
    // ... (Mantenha seu objeto de coordenadas aqui) ...
    let coordenadas = { /* ... */ };
    let pdfOriginalBytes = null;

    async function salvarEFinalizarNoServidor() {
        if (!pdfOriginalBytes) return alert("PDF não carregado!");
        if (!confirm("Finalizar atendimento e arquivar a RAT?")) return;
        
        const bytes = await processarDocumento();
        const dadosForm = new FormData();
        dadosForm.append('pdf', new Blob([bytes], { type: 'application/pdf' }), 'rat_firmada.pdf');

        fetch('/chamado/{{ chamado.id }}/finalizar', { 
            method: 'POST', 
            body: dadosForm 
        })
        .then(res => res.json())
        .then(dados => {
            // A chave 'sucesso' é o padrão que o Flask deve retornar
            if (dados.sucesso) {
                alert(dados.mensagem || "Chamado arquivado com sucesso!");
                window.location.href = '/admin';
            } else {
                alert("Erro ao arquivar: " + (dados.erro || "Falha no servidor"));
            }
        })
        .catch(err => {
            console.error(err);
            alert("Erro de comunicação com o servidor.");
        });
    }

    // ... (Mantenha as demais funções: atualizarPreview, processarDocumento, etc.) ...
    window.onload = inicializarInterface;
</script>
</body>
</html>
