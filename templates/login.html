<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Técnico - JRV-TI</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; padding: 100px 20px; margin: 0; }
        .container { max-width: 380px; background: white; padding: 30px; margin: auto; border: 2px solid #000000; text-align: center; box-shadow: 5px 5px 0px #000000; }
        h2 { color: #000000; margin-bottom: 20px; text-transform: uppercase; }
        label { font-weight: bold; display: block; margin-top: 15px; text-align: left; color: #000000; }
        input { width: 100%; padding: 10px; margin-top: 6px; border: 2px solid #000000; box-sizing: border-box; }
        .btn-login { width: 100%; background: #000000; color: white; padding: 12px; border: none; margin-top: 20px; cursor: pointer; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .btn-login:hover { background: #333333; }
        .erro { color: black; font-weight: bold; background: #ffcccc; padding: 8px; margin-top: 10px; font-size: 14px; border: 1px solid red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>JRV-TI — Autenticação</h2>
        
        <form method="POST" action="/login">
            <label>Usuário Técnico:</label>
            <input type="text" name="usuario" placeholder="Ex: tecnicon1" required>

            <label>Senha de Acesso:</label>
            <input type="password" name="senha" placeholder="••••••••" required>

            {% if erro %}
                <div class="erro">❌ {{ erro }}</div>
            {% endif %}

            <button type="submit" class="btn-login">Acessar Painel</button>
        </form>
    </div>
</body>
</html>
